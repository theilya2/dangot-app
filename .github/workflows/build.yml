name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        id: ver
        run: |
          CODE=$(( ${{ github.run_number }} + 100 ))
          NAME="1.$CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/dangot.keystore
            echo "keystore decoded - stable signature"
          else
            echo "no KEYSTORE_B64 secret set - using random debug signature"
          fi

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASS: dangot123
          KEY_ALIAS: dangot
          KEY_PASS: dangot123
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dangot-notifications-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.name }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Dangot Notifications $TAG" \
            --notes "auto build ${{ steps.ver.outputs.name }}" \
            --latest

      - name: Register version in Firebase
        env:
          CODE: ${{ steps.ver.outputs.code }}
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          DB="https://diary-dangot-default-rtdb.europe-west1.firebasedatabase.app/appversion.json"
          curl -fsS -X PUT "$DB" \
            -H "Content-Type: application/json" \
            --data "{\"versionCode\":$CODE,\"versionName\":\"$NAME\",\"url\":\"$URL\",\"notes\":\"update $NAME\"}"
